[package]
name = "agentws"
version = "0.1.0"
edition = "2021"
authors = ["charanv"]
description = "Per-story workspaces for AI coding agents across polyrepo codebases"
license = "MIT"

[[bin]]
name = "agentws"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
directories = "5"
ratatui = "0.28"
crossterm = "0.28"
fuzzy-matcher = "0.3"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
